## Core Infrastructure — default values
## All custom service images reference ghcr.io/kikkirej/ops/<service>:latest

eureka:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kikkirej/ops/eureka
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8761
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

config-server:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kikkirej/ops/config-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8888
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configRepo:
    storageSize: 1Gi

keycloak:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  postgres:
    storageSize: 5Gi

kafka:
  enabled: true
  replicaCount: 1
  image:
    repository: apache/kafka
    tag: "3.9"
    pullPolicy: IfNotPresent
  service:
    port: 9092
  replicationFactor: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storage:
    size: 10Gi

traefik:
  enabled: true
  replicaCount: 1
  image:
    repository: traefik
    tag: "v3"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    httpPort: 80
    httpsPort: 443

spring-boot-admin:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kikkirej/ops/spring-boot-admin
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8090
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

## Observability — disabled by default; enable via values.observability.yaml
jaeger:
  enabled: false
  image:
    repository: jaegertracing/all-in-one
    tag: "2"
  service:
    grpcPort: 4317
    httpPort: 4318
    uiPort: 16686
  storage:
    size: 5Gi

opensearch:
  enabled: false
  image:
    repository: opensearchproject/opensearch
    tag: "2"
  service:
    port: 9200
  storage:
    size: 20Gi

logstash:
  enabled: false
  image:
    repository: opensearchproject/logstash-oss-with-opensearch-output-plugin
    tag: "8"
  service:
    port: 5044

opensearch-dashboards:
  enabled: false
  image:
    repository: opensearchproject/opensearch-dashboards
    tag: "2"
  service:
    port: 5601
