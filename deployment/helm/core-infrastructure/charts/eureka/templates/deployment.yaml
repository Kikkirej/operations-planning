apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eureka.fullname" . }}
  labels:
    app: {{ include "eureka.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "eureka.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "eureka.fullname" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: eureka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "eureka.fullname" . }}-secrets
                  key: keycloak-url
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
