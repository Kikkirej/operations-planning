{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jaeger.fullname" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "jaeger.fullname" . }}
  ports:
    - port: {{ .Values.service.grpcPort }}
      targetPort: 4317
      name: otlp-grpc
    - port: {{ .Values.service.httpPort }}
      targetPort: 4318
      name: otlp-http
    - port: {{ .Values.service.uiPort }}
      targetPort: 16686
      name: ui
{{- end }}
