{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensearch.fullname" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "opensearch.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
{{- end }}
