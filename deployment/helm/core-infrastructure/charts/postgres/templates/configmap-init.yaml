apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.fullname" . }}-init
  labels:
    app: {{ include "postgres.fullname" . }}
data:
  01-init-app-role.sql: |
    -- Bootstrap role for all application services.
    CREATE ROLE app WITH LOGIN NOINHERIT;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT CONNECT ON DATABASE {{ .Values.auth.database }} TO app;
