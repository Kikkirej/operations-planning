global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]
    metrics_path: /metrics

  - job_name: eureka
    static_configs:
      - targets: ["eureka:8761"]
    metrics_path: /actuator/prometheus

  - job_name: config-server
    static_configs:
      - targets: ["config-server:8888"]
    metrics_path: /actuator/prometheus

  - job_name: spring-boot-admin
    static_configs:
      - targets: ["spring-boot-admin:8090"]
    metrics_path: /actuator/prometheus

  - job_name: neo4j
    static_configs:
      - targets: ["neo4j:2004"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
