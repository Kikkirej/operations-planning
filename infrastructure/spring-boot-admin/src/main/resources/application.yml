spring:
  application:
    name: spring-boot-admin
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-boot-admin
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,profile,email,roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # authorization-uri uses the public URL so browser redirects work from outside Docker.
            # token/jwks/userinfo use the internal URL to avoid split-DNS startup failures.
            authorization-uri: ${KEYCLOAK_PUBLIC_URL:https://auth.ops.local}/realms/operations/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/operations/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/operations/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/operations/protocol/openid-connect/certs
            user-name-attribute: preferred_username

server:
  port: 8090
  forward-headers-strategy: native

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka/}
  instance:
    metadata-map:
      user.name: ${SPRING_BOOT_ADMIN_CLIENT_USERNAME:actuator}
      user.password: ${SPRING_BOOT_ADMIN_CLIENT_PASSWORD:actuator}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
