api:
  dashboard: true
  insecure: true

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    network: compose_app-net
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

tls:
  options:
    default:
      minVersion: VersionTLS12

log:
  level: INFO

accessLog: {}
