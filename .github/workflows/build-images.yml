name: Build & Push Service Images

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kikkirej/ops

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [eureka, config-server, spring-boot-admin]
        include:
          - service: test-runner
            test_only: true
          - service: config-server
            has_integration_tests: true
          - service: spring-boot-admin
            has_integration_tests: true
      fail-fast: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests (docker build --target test)
        run: |
          docker build \
            --target test \
            --cache-from type=gha,scope=${{ matrix.service }}-test \
            --cache-to   type=gha,scope=${{ matrix.service }}-test,mode=max \
            -f infrastructure/${{ matrix.service }}/Dockerfile \
            .

      - name: Set up JDK 21
        if: ${{ matrix.has_integration_tests }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        if: ${{ matrix.has_integration_tests }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Run integration tests
        if: ${{ matrix.has_integration_tests }}
        run: |
          gradle :infrastructure:${{ matrix.service }}:test --no-daemon -PonlyIntegration=true

      - name: Compute image tags
        id: meta
        if: ${{ !matrix.test_only }}
        run: |
          REF="${{ github.ref_name }}"
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          TAGS="${IMAGE}:${REF}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        if: ${{ !matrix.test_only }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/${{ matrix.service }}/Dockerfile
          target: runtime
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}-runtime
          cache-to:   type=gha,scope=${{ matrix.service }}-runtime,mode=max
