name: Build & Push Service Images

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kikkirej/ops

jobs:
  check-certs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check certificate expiry
        run: |
          WARN_DAYS=30
          FAIL=0

          check_cert() {
            local cert="$1"
            local label="$2"
            if [ ! -f "$cert" ]; then
              echo "SKIP: $label not found (gitignored or not yet generated)"
              return
            fi
            expiry=$(openssl x509 -enddate -noout -in "$cert" | cut -d= -f2)
            expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || date -j -f "%b %e %T %Y %Z" "$expiry" +%s 2>/dev/null)
            now_epoch=$(date +%s)
            days=$(( (expiry_epoch - now_epoch) / 86400 ))
            if [ "$days" -le "$WARN_DAYS" ]; then
              echo "FAIL: $label expires in $days day(s) (on $expiry)"
              echo "      Renew locally with ./setup.sh --renew (or --renew-ca for CA) and commit local-ca.crt"
              FAIL=1
            else
              echo "OK:   $label valid for $days more day(s) (expires $expiry)"
            fi
          }

          check_cert "infrastructure/certs/trust/local-ca.crt" "platform CA"
          check_cert "infrastructure/certs/server/local.crt"   "server cert"

          [ "$FAIL" -eq 0 ] || exit 1

  build:
    runs-on: ubuntu-latest
    needs: check-certs
    strategy:
      matrix:
        service: [eureka, config-server, spring-boot-admin]
        include:
          - service: test-runner
            test_only: true
          - service: config-server
            has_integration_tests: true
          - service: spring-boot-admin
            has_integration_tests: true
      fail-fast: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests (docker build --target test)
        run: |
          docker build \
            --target test \
            --cache-from type=gha,scope=${{ matrix.service }}-test \
            --cache-to   type=gha,scope=${{ matrix.service }}-test,mode=max \
            -f infrastructure/${{ matrix.service }}/Dockerfile \
            .

      - name: Set up JDK 21
        if: ${{ matrix.has_integration_tests }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        if: ${{ matrix.has_integration_tests }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Run integration tests
        if: ${{ matrix.has_integration_tests }}
        run: |
          gradle :infrastructure:${{ matrix.service }}:test --no-daemon -PonlyIntegration=true

      - name: Compute image tags
        id: meta
        if: ${{ !matrix.test_only }}
        run: |
          REF="${{ github.ref_name }}"
          REF="${REF//\//-}"
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          TAGS="${IMAGE}:${REF}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        if: ${{ !matrix.test_only }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/${{ matrix.service }}/Dockerfile
          target: runtime
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}-runtime
          cache-to:   type=gha,scope=${{ matrix.service }}-runtime,mode=max
